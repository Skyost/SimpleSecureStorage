name: simple_secure_storage_linux_libsecret
description: Legacy libsecret-based Linux implementation of Simple Secure Storage, preserved as an optional, unmaintained compatibility fallback.
version: 0.1.0
homepage: https://github.com/Skyost/SimpleSecureStorage
repository: https://github.com/Skyost/SimpleSecureStorage/tree/main/packages/simple_secure_storage_linux_libsecret
issue_tracker: https://github.com/Skyost/SimpleSecureStorage/issues
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.29.0'

flutter:
  plugin:
    implements: simple_secure_storage
    platforms:
      linux:
        pluginClass: SimpleSecureStorageLinuxLibsecretPlugin
        dartPluginClass: SimpleSecureStorageLinuxLibsecret

dependencies:
  flutter:
    sdk: flutter
  simple_secure_storage_platform_interface: ^0.2.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
